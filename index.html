<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowWeb — Flowchart IDE</title>
<link rel="stylesheet" href="src/styles/md3.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='256' height='256' rx='44' fill='url(%23b)'/%3E%3Crect x='88' y='24' width='80' height='44' rx='22' fill='%231a1c1e'/%3E%3Crect x='76' y='100' width='104' height='54' rx='12' fill='%23fff' fill-opacity='.95'/%3E%3Cpath d='M96 118h48M96 134h32' stroke='%230d248a' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M128 188 L168 212 L128 236 L88 212 Z' fill='%23fff' fill-opacity='.95'/%3E%3Cpath d='M128 68 V92 M128 154 V184' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="main">
    <div id="palette"></div>
    <div id="center">
      <div id="fntabs"></div>
      <div id="canvaswrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>
  <div id="bottom">
    <div id="bottomtabs">
      <button class="btab active" data-p="console">Console</button>
      <button class="btab" data-p="vars">Variabili</button>
      <button class="btab" data-p="turtle">Tartaruga</button>
      <span class="grow"></span>
      <button class="btn small mini" id="console-clear"></button>
    </div>
    <div id="panel-console" class="bpanel active"><div id="console"></div></div>
    <div id="panel-vars" class="bpanel"><div id="vars-hint"></div></div>
    <div id="panel-turtle" class="bpanel">
      <div id="turtle-wrap">
        <canvas id="turtle-path" width="420" height="420"></canvas>
        <canvas id="turtle-mark" width="420" height="420"></canvas>
        <div id="turtle-hud"></div>
      </div>
    </div>
  </div>
  <div id="statusbar"><span id="status-left">Pronto.</span><span id="status-right"></span></div>
  <div id="modal-root"></div>
  <datalist id="fndatalist"></datalist>

  <script src="src/i18n.js"></script>
  <script src="src/helpers.js"></script>
  <script src="src/parser.js"></script>
  <script src="src/model.js"></script>
  <script src="src/examples.js"></script>
  <script src="src/types.js"></script>
  <script src="src/turtle.js"></script>
  <script src="src/runtime.js"></script>
  <script src="src/run_control.js"></script>
  <script src="src/render.js"></script>
  <script src="src/codegen.js"></script>
  <script src="src/ui/base.js"></script>
  <script src="src/ui/tabs.js"></script>
  <script src="src/ui/dnd.js"></script>
  <script src="src/ui/context_menu.js"></script>
  <script src="src/ui/palette.js"></script>
  <script src="src/ui/toolbar.js"></script>
  <script src="src/ui/menubar.js"></script>
  <script src="src/ui/file_ops.js"></script>
  <script src="src/ui/theme.js"></script>
  <script src="src/ui/modal_framework.js"></script>
  <script src="src/ui/input_dialog.js"></script>
  <script src="src/ui/form_helpers.js"></script>
  <script src="src/ui/block_modal.js"></script>
  <script src="src/ui/function_modal.js"></script>
  <script src="src/ui/export_modal.js"></script>
  <script src="src/ui/help_about.js"></script>
  <script src="src/boot.js"></script>
</body>
</html>
