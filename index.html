<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowWeb — Flowchart IDE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='256' height='256' rx='44' fill='url(%23b)'/%3E%3Crect x='88' y='24' width='80' height='44' rx='22' fill='%231a1c1e'/%3E%3Crect x='76' y='100' width='104' height='54' rx='12' fill='%23fff' fill-opacity='.95'/%3E%3Cpath d='M96 118h48M96 134h32' stroke='%230d248a' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M128 188 L168 212 L128 236 L88 212 Z' fill='%23fff' fill-opacity='.95'/%3E%3Cpath d='M128 68 V92 M128 154 V184' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E"/>
<style>
  /* =====================================================================
     Material Design 3 styling for FlowWeb.
     - Design tokens as CSS custom properties (MD3 color roles, elevation,
       shape scale, type scale, state layers).
     - Light + dark themes: [data-theme] attribute on <html>, "auto" falls
       back to prefers-color-scheme.
     - No external dependencies: the palette below is a static MD3 tonal
       palette generated from a #1a5fb4-like seed (blue, 40 = primary).
     ===================================================================== */

  :root {
    /* --- MD3 tonal palette (seed: blue) --- */
    --md-primary-0: #000000;  --md-primary-10: #001b3d;  --md-primary-20: #003061;
    --md-primary-30: #004687;  --md-primary-40: #1a5fb4;  --md-primary-80: #a5c8ff;
    --md-primary-90: #d3e4ff;
    --md-secondary-30: #4a5568; --md-secondary-40: #5b6779; --md-secondary-80: #bcc7db;
    --md-secondary-90: #d7e3ee;
    --md-neutral-0: #ffffff;   --md-neutral-4: #f5f7fa;   --md-neutral-6: #eef1f6;
    --md-neutral-10: #1a1c1e;  --md-neutral-20: #2f3134;   --md-neutral-90: #e1e3e8;
    --md-neutral-92: #e6e8ec;  --md-neutral-94: #eceef1;   --md-neutral-96: #f2f4f7;
    --md-neutral-98: #f8f9fb;  --md-neutral-99: #fdfcfa;
    --md-neutral-var-30: #464a52; --md-neutral-var-50: #767b84; --md-neutral-var-60: #8f949d;
    --md-error-30: #93000a;    --md-error-40: #ba1a1a;    --md-error-80: #ffb4ab;
    --md-error-90: #ffdad6;
    --md-tertiary-40: #8a5a00; --md-tertiary-80: #ffdf9e;

    /* --- light theme color roles --- */
    --md-bg: var(--md-neutral-98);
    --md-surface: var(--md-neutral-99);
    --md-surface-1: var(--md-neutral-96);
    --md-surface-2: var(--md-neutral-92);
    --md-surface-3: var(--md-neutral-90);
    --md-surface-variant: #e1e3e8;
    --md-on-bg: var(--md-neutral-10);
    --md-on-surface: #191c20;
    --md-on-surface-var: #464a52;
    --md-primary: var(--md-primary-40);
    --md-on-primary: #ffffff;
    --md-primary-container: var(--md-primary-90);
    --md-on-primary-container: var(--md-primary-10);
    --md-secondary-container: var(--md-secondary-90);
    --md-on-secondary-container: #121c2b;
    --md-error: var(--md-error-40);
    --md-on-error-container: #410002;
    --md-outline: #767b84;
    --md-outline-variant: #c3c7cf;
    --md-inverse-surface: #2f3134;
    --md-inverse-on-surface: var(--md-neutral-96);
    --md-scrim: rgba(0, 0, 0, .35);

    /* --- elevation (MD3 levels 0-5) --- */
    --md-elev-1: 0 1px 2px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);
    --md-elev-2: 0 1px 2px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.08);
    --md-elev-3: 0 4px 8px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);

    /* --- shape scale (subset) --- */
    --md-shape-xs: 4px;
    --md-shape-s: 8px;
    --md-shape-m: 12px;
    --md-shape-l: 16px;

    /* --- MD3 type scale (subset, adapted to a dense IDE) --- */
    --md-font: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --md-font-mono: "Roboto Mono", "Cascadia Code", Consolas, Menlo, monospace;
    --md-type-label-l: 500 14px/20px var(--md-font);
    --md-type-label-m: 500 12px/16px var(--md-font);
    --md-type-label-s: 500 11px/16px var(--md-font);
    --md-type-body-m: 400 12.5px/18px var(--md-font);
    --md-type-body-s: 400 11px/16px var(--md-font);
    --md-type-title-s: 500 14px/20px var(--md-font);

    /* --- MD3 state layers --- */
    --md-hover: 8%;
    --md-focus: 12%;
    --md-pressed: 12%;
    --md-dragged: 16%;

    color-scheme: light;
  }

  html[data-theme="dark"] {
    --md-bg: var(--md-neutral-10);
    --md-surface: #121417;
    --md-surface-1: #1a1c20;
    --md-surface-2: #22252a;
    --md-surface-3: #2a2d33;
    --md-surface-variant: #464a52;
    --md-on-bg: var(--md-neutral-90);
    --md-on-surface: #e1e3e8;
    --md-on-surface-var: #c3c7cf;
    --md-primary: var(--md-primary-80);
    --md-on-primary: var(--md-primary-10);
    --md-primary-container: var(--md-primary-30);
    --md-on-primary-container: var(--md-primary-90);
    --md-secondary-container: #33415a;
    --md-on-secondary-container: var(--md-secondary-90);
    --md-error: var(--md-error-80);
    --md-on-error-container: var(--md-error-90);
    --md-outline: #8f949d;
    --md-outline-variant: #464a52;
    --md-inverse-surface: var(--md-neutral-96);
    --md-inverse-on-surface: #2f3134;
    --md-scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: var(--md-type-body-m);
    font-family: var(--md-font);
    background: var(--md-bg);
    color: var(--md-on-bg);
    display: flex; flex-direction: column; overflow: hidden;
    transition: background .2s ease, color .2s ease;
  }
  button { font: inherit; font-family: inherit; }

  /* ---------- MD3 filled text field ---------- */
  input, select, textarea {
    font: var(--md-type-body-m); font-family: inherit;
    color: var(--md-on-surface);
    border: 1px solid var(--md-outline); border-radius: var(--md-shape-xs);
    padding: 6px 10px; background: var(--md-surface);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--md-on-surface); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--md-primary);
    box-shadow: inset 0 0 0 1px var(--md-primary);
  }
  textarea { font-family: var(--md-font-mono); }
  ::placeholder { color: var(--md-on-surface-var); opacity: .7; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--md-outline-variant); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---- top app bar ---- */
  #menubar {
    display: flex; align-items: center; gap: 2px;
    background: var(--md-surface-2); padding: 4px 8px;
    user-select: none; flex: none; position: relative; z-index: 150;
  }
  #app-title { font: var(--md-type-title-s); color: var(--md-on-surface); margin-right: 10px; letter-spacing: .3px; }
  #app-title b { color: var(--md-primary); }
  .menu-item { padding: 6px 12px; cursor: default; position: relative; border-radius: var(--md-shape-s); font: var(--md-type-label-m); color: var(--md-on-surface); }
  .menu-item:hover, .menu-item.open { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
  .menu-item.open { background: color-mix(in srgb, var(--md-primary) 15%, transparent); }

  .dropdown {
    position: absolute; top: calc(100% + 2px); left: 0; min-width: 230px;
    background: var(--md-surface-2); border-radius: var(--md-shape-s);
    box-shadow: var(--md-elev-2); z-index: 200; padding: 6px 0;
  }
  .dropdown .di { padding: 8px 20px 8px 16px; cursor: default; white-space: nowrap; border-radius: 0; font: var(--md-type-body-m); color: var(--md-on-surface); }
  .dropdown .di:hover { background: color-mix(in srgb, var(--md-primary) 12%, transparent); }
  .dropdown .di.disabled { color: var(--md-outline); }
  .dropdown .di.disabled:hover { background: none; color: var(--md-outline); }
  .dropdown .sep { height: 1px; background: var(--md-outline-variant); margin: 5px 8px; }

  /* ---- toolbar ---- */
  #toolbar {
    display: flex; align-items: center; gap: 4px; padding: 6px 10px;
    background: var(--md-surface-1); user-select: none; flex-wrap: wrap; flex: none;
    border-bottom: 1px solid var(--md-outline-variant);
  }
  .tbtn {
    min-width: 56px; padding: 6px 8px 4px; background: transparent; border: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    color: var(--md-on-surface-var); border-radius: var(--md-shape-s);
    font: var(--md-type-label-s);
    transition: background .15s ease, color .15s ease;
  }
  .tbtn svg { width: 22px; height: 22px; }
  .tbtn span { font-size: 10.5px; letter-spacing: .2px; }
  .tbtn:hover:not(:disabled) { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); color: var(--md-on-surface); }
  .tbtn:active:not(:disabled) { background: color-mix(in srgb, var(--md-primary) 16%, transparent); }
  .tbtn:disabled { opacity: .38; cursor: default; }
  .tsep { width: 1px; height: 30px; background: var(--md-outline-variant); margin: 0 6px; }

  #speed-wrap, #zoom-wrap { display: flex; align-items: center; gap: 8px; padding: 0 6px; color: var(--md-on-surface-var); }
  #speed-wrap label, #zoom-wrap span { font: var(--md-type-label-s); }
  #speed-wrap input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 120px; height: 4px; padding: 0; border: none; border-radius: 2px;
    background: linear-gradient(to right, var(--md-primary) var(--fill, 17%), var(--md-surface-3) var(--fill, 17%));
    cursor: pointer; box-shadow: none;
  }
  #speed-wrap input[type="range"]:hover { box-shadow: none; border: none; }
  #speed-wrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--md-primary); border: 2px solid var(--md-surface-1); box-shadow: var(--md-elev-1);
  }
  #speed-wrap input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--md-primary); border: 2px solid var(--md-surface-1); box-shadow: var(--md-elev-1);
  }
  #zoom-wrap .zbtn { min-width: 32px; height: 32px; padding: 0 6px; font: var(--md-type-label-m); }


  /* ---- language selector in the top app bar ---- */
  #menubar > .grow { flex: 1; }
  #lang-btn {
    border: none; background: transparent; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    font: var(--md-type-label-m); color: var(--md-on-surface);
    padding: 6px 10px; border-radius: var(--md-shape-s);
  }
  #lang-btn:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
  #lang-btn .lang-flag { font-size: 18px; line-height: 1; }
  #lang-btn .lang-code { letter-spacing: .5px; font-weight: 600; }
  .lang-flag { font-size: 16px; line-height: 1; vertical-align: middle; }
  #langmenu { min-width: 180px; position: fixed; left: auto; top: auto; z-index: 600; }
  #langmenu .di.selected { background: color-mix(in srgb, var(--md-primary) 16%, transparent); color: var(--md-primary); font-weight: 600; }
  #langmenu .di:hover { background: color-mix(in srgb, var(--md-primary) 12%, transparent); }

  /* ---- main ---- */
  #main { flex: 1; display: flex; min-height: 0; }

  #palette {
    width: 200px; background: var(--md-surface-1); overflow-y: auto;
    padding: 10px; user-select: none; flex: none;
    border-right: 1px solid var(--md-outline-variant);
  }
  #palette h3 {
    margin: 6px 4px 10px; font: var(--md-type-label-s); color: var(--md-on-surface-var);
    text-transform: uppercase; letter-spacing: .8px;
  }
  .pal-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 4px;
    background: var(--md-surface); border: 1px solid transparent; cursor: grab;
    border-radius: var(--md-shape-s); color: var(--md-on-surface);
    transition: background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .pal-item:hover {
    background: var(--md-surface-2);
    border-color: var(--md-outline-variant);
  }
  .pal-item:active { transform: scale(.98); }
  .pal-item svg { width: 56px; height: 26px; flex: none; }
  .pal-item span { font: var(--md-type-body-m); }

  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #fntabs {
    display: flex; align-items: center; background: var(--md-surface-1);
    border-bottom: 1px solid var(--md-outline-variant);
    padding: 0 8px; overflow-x: auto; user-select: none; flex: none; min-height: 40px;
  }
  .fntab {
    padding: 10px 18px; background: transparent; border: none; margin: 6px 2px 0;
    cursor: pointer; white-space: nowrap; border-radius: var(--md-shape-s) var(--md-shape-s) 0 0;
    color: var(--md-on-surface-var); font: var(--md-type-label-m);
    position: relative; transition: background .15s ease, color .15s ease;
  }
  .fntab:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); color: var(--md-on-surface); }
  .fntab.active {
    background: var(--md-surface); color: var(--md-primary); font-weight: 600;
  }
  .fntab.active::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px;
    background: var(--md-primary); border-radius: 3px 3px 0 0;
  }
  .fntab.add { font-weight: 700; font-size: 16px; line-height: 1; color: var(--md-on-surface-var); }
  .fntab.add:hover { color: var(--md-primary); background: color-mix(in srgb, var(--md-primary) 12%, transparent); }

  #canvaswrap { flex: 1; overflow: auto; background: var(--md-surface); position: relative; }
  #svg { display: block; cursor: default; }

  /* ---- svg bits ---- */
  .blk { cursor: pointer; }
  .blk .shape { stroke: rgba(0,0,0,.25); stroke-width: 1; }
  html[data-theme="dark"] .blk .shape { stroke: rgba(0,0,0,.45); }
  .blk.current .shape { stroke: var(--md-primary-40); stroke-width: 3; animation: blkPulse .85s infinite; }
  html[data-theme="dark"] .blk.current .shape { stroke: var(--md-primary-80); }
  .blk.err .shape { stroke: var(--md-error-40); stroke-width: 3; }
  html[data-theme="dark"] .blk.err .shape { stroke: var(--md-error-80); }
  @keyframes blkPulse {
    0%, 100% { stroke-width: 3; }
    50% { stroke: var(--md-tertiary-80); stroke-width: 4; }
  }
  .flowline { stroke: var(--md-on-surface-var); stroke-width: 1.6; fill: none; }
  .flowarrow { fill: var(--md-on-surface-var); }
  .lbl { font: 10.5px var(--md-font); fill: var(--md-on-surface-var); }
  .bt-text { font: 13px var(--md-font); fill: #fff; }
  .bt-text.comment { fill: var(--md-on-surface-var); font-style: italic; }
  .placeholder-box { fill: none; stroke: var(--md-outline-variant); stroke-dasharray: 4 3; }
  .placeholder-text { font: 11px var(--md-font); fill: var(--md-outline); }
  .dz { display: none; }
  svg.dragging .dz { display: inline; }
  .dz rect { fill: color-mix(in srgb, #4caf50 14%, transparent); stroke: #4caf50; stroke-dasharray: 4 3; }
  .dz.hot rect { fill: color-mix(in srgb, #4caf50 45%, transparent); stroke: #2e7d32; }

  /* ---- bottom panel ---- */
  #bottom {
    height: 250px; display: flex; flex-direction: column;
    background: var(--md-surface-1); min-height: 60px; flex: none;
    border-top: 1px solid var(--md-outline-variant);
  }
  #bottomtabs {
    display: flex; align-items: center; gap: 0; background: var(--md-surface-2);
    padding: 4px 8px 0; flex: none;
  }
  .btab {
    padding: 8px 18px; border: none; background: transparent; cursor: pointer;
    border-radius: var(--md-shape-s) var(--md-shape-s) 0 0;
    color: var(--md-on-surface-var); font: var(--md-type-label-m);
    transition: background .15s ease, color .15s ease;
  }
  .btab:hover:not(.active) { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); color: var(--md-on-surface); }
  .btab.active { background: var(--md-surface); color: var(--md-primary); font-weight: 600; }
  #bottomtabs .grow { flex: 1; }
  #bottomtabs .mini { padding: 5px 12px; }
  .bpanel { flex: 1; display: none; min-height: 0; }
  .bpanel.active { display: flex; }
  #console {
    flex: 1; overflow-y: auto; background: var(--md-surface); padding: 10px 12px;
    font: 12.5px var(--md-font-mono); white-space: pre-wrap; color: var(--md-on-surface);
  }
  #console .err { color: var(--md-error); }
  #console .in { color: var(--md-on-surface-var); }
  #console .sys { color: var(--md-primary); opacity: .85; }
  #panel-vars { overflow: auto; background: var(--md-surface); }
  #vars-table { width: 100%; border-collapse: collapse; background: var(--md-surface); }
  #vars-table th {
    text-align: left; background: var(--md-surface-2); border-bottom: 1px solid var(--md-outline-variant);
    padding: 8px 12px; font: var(--md-type-label-s); color: var(--md-on-surface-var);
    text-transform: uppercase; letter-spacing: .5px;
  }
  #vars-table td { padding: 5px 12px; border-bottom: 1px solid color-mix(in srgb, var(--md-outline-variant) 45%, transparent); font: 12.5px var(--md-font-mono); color: var(--md-on-surface); }
  #vars-table .fnrow td { background: var(--md-primary-container); font: var(--md-type-label-m); color: var(--md-on-primary-container); font-family: var(--md-font); }
  #vars-table td.changed { color: var(--md-primary); font-weight: 700; }
  #vars-hint { padding: 14px; color: var(--md-on-surface-var); font: var(--md-type-body-m); }
  #turtle-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: var(--md-surface); }
  #turtle-path, #turtle-mark { position: absolute; }
  #turtle-hud { position: absolute; top: 8px; left: 10px; font: 11px var(--md-font-mono); color: var(--md-on-surface-var); }

  /* ---- status bar ---- */
  #statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 12px; background: var(--md-surface-2); color: var(--md-on-surface-var);
    user-select: none; flex: none; font: var(--md-type-body-s);
  }
  #statusbar.err { color: var(--md-error); }

  /* ---- modals ---- */
  #modal-root { position: fixed; inset: 0; z-index: 500; pointer-events: none; }
  .overlay {
    position: fixed; inset: 0; background: var(--md-scrim);
    display: flex; align-items: center; justify-content: center; pointer-events: auto;
  }
  .dialog {
    background: var(--md-surface-2); border-radius: var(--md-shape-l);
    box-shadow: var(--md-elev-3);
    min-width: 400px; max-width: 680px; max-height: 85vh; display: flex; flex-direction: column;
  }
  .dialog-title {
    background: transparent; padding: 20px 24px 4px; font: 500 16px/24px var(--md-font);
    color: var(--md-on-surface); display: flex; justify-content: space-between;
    -webkit-user-select: none; user-select: none;
  }
  .dialog-title .x {
    cursor: pointer; padding: 2px 8px; border-radius: 50%; color: var(--md-on-surface-var);
    transition: background .15s ease;
  }
  .dialog-title .x:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); color: var(--md-on-surface); }
  .dialog-body { padding: 12px 24px 4px; overflow: auto; color: var(--md-on-surface); }
  .dialog-foot {
    padding: 16px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; align-items: center;
  }
  .formrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .formrow label { width: 110px; text-align: right; color: var(--md-on-surface-var); flex: none; font: var(--md-type-label-m); }
  .formrow .fill { flex: 1; }
  .rows-table { width: 100%; border-collapse: collapse; margin: 4px 0 12px; }
  .rows-table td { padding: 3px 4px; }
  .rows-table input, .rows-table select { width: 100%; }
  .rows-table .delrow { width: 28px; }

  /* ---- MD3 buttons ---- */
  .btn {
    min-width: 88px; padding: 8px 18px; border: none; border-radius: 100px;
    background: transparent; cursor: pointer; color: var(--md-primary);
    font: var(--md-type-label-m); letter-spacing: .3px;
    transition: background .15s ease, box-shadow .15s ease;
    position: relative;
  }
  .btn:hover { background: color-mix(in srgb, var(--md-primary) 10%, transparent); }
  .btn:active { background: color-mix(in srgb, var(--md-primary) 16%, transparent); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary {
    background: var(--md-primary); color: var(--md-on-primary);
    box-shadow: var(--md-elev-1);
  }

function makeFrame(fn) {

    vars[p.name.toLowerCase()] = { name: p.name, type: p.type, arr: false, size: 0, value: null };
  });

    if (b.type !== "declare") return;
    b.vars.forEach(function (v) {
      var key = v.name.toLowerCase();

        var items = [];

async function ev(n, frame) {

    case "str": return { t: "String", v: n.v };
    case "bool": return { t: "Boolean", v: n.v };

    }
    case "idx": {

      if (!rec2.arr) throw rtErr(n.name + " non \u00e8 un array");

        if (n.op === "or" && l.v) return { t: "Boolean", v: true };
        var r = await ev(n.r, frame);
        if (r.t !== "Boolean") throw rtErr("'" + n.op + "' richiede Boolean");
        return { t: "Boolean", v: r.v };

async function callFn(fn, argVals) {

  var frame = makeFrame(fn);

    frame.vars[p.name.toLowerCase()].value = coerce(argVals[i], p.type);

  RT.updateWatch();
  var ret = defaultVal(fn.ret || "Integer");
  try {
    await execChain(fn.body, frame);
  } catch (e) {
    if (e && e.__ret) { ret = e.value; }
    else { RT.frames.pop(); RT.updateWatch(); throw e; }
  }
  RT.frames.pop();
  RT.updateWatch();
  return ret;
}

  for (var i = 0; i < arr.length; i++) {
    await RT.gate(arr[i]);
    await execBlock(arr[i], frame);

      var dispName = rec.name + (b.index ? "[" + b.index + "]" : "");

      if (ans === null) throw { stop: true };
      var v2 = coerceInput(ans, rec.type);
      if (rec.arr) arraySet(rec, (await ev(parse(b.index), frame)), v2);

      if (c.t !== "Boolean") throw rtErr("La condizione di If deve essere Boolean (ricevuto " + c.t + ")");

/* ------------------------------------------------ avvio / controlli run */
async function startRun(mode) {
  if (RT.state === "running") return;
  RT.state = "running";
  RT.paused = false; RT.stepping = (mode === "step");
  RT.stopFlag = false; RT.steps = 0; RT.frames = []; RT.currentBlock = null;
  consoleClear();
  turtleReset();
  setRunUI();
  RT.outLine(t("run.start") + fns()[0].name + "' " + "\u2014\n", "sys");
  var t0 = Date.now();
  try {
    await callFn(fns()[0], []);
    RT.outLine(t("run.end") + RT.steps + t("status.steps") + t("run.in") + ((Date.now() - t0) / 1000).toFixed(1) + "s \u2014", "sys");
    setStatus(t("status.done") + ": " + RT.steps + t("status.steps") + ".");
  } catch (e) {
    if (e && e.stop) {
      RT.outLine(t("run.interrupt"), "sys");
      setStatus(t("status.stopped"));
    } else {
      var msg = (e && e.message) ? e.message : String(e);
      RT.outLine(t("status.error") + msg, "err");
      setStatus(t("status.error") + msg, true);
      if (e && e.block) { RT.highlight(e.block.id); DRAW.els[e.block.id] && DRAW.els[e.block.id].classList.add("err"); }
    }
  } finally {
    RT.state = "idle"; RT.paused = false; RT.stepping = false;
    RT.highlight(null);
    setRunUI();
  }
}

  (fn.params || []).forEach(function (p) { if (p.name.toLowerCase() === nm) found = p.type; });

        } else if (lang === "js") {
          var p2 = pr ? "prompt(" + pr + ")" : "prompt('')";
          if (t2 === "Integer") out.push(pad + dst2 + " = parseInt(" + p2 + ", 10)");
          else if (t2 === "Real") out.push(pad + dst2 + " = parseFloat(" + p2 + ")");
          else if (t2 === "Boolean") out.push(pad + dst2 + " = _pb(" + p2 + ")");
          else if (t2 === "Char") out.push(pad + dst2 + " = (" + p2 + " || ' ')[0]");
          else out.push(pad + dst2 + " = " + p2);
        } else if (lang === "c") {
          if (pr) out.push(pad + "printf(" + pr + ");");
          if (t2 === "Integer") out.push(pad + 'scanf("%d", ' + ref + ");");
          else if (t2 === "Real") out.push(pad + 'scanf("%lf", ' + ref + ");");
          else if (t2 === "String") out.push(pad + 'scanf("%255s", ' + dst2 + ");");
          else if (t2 === "Boolean") out.push(pad + dst2 + " = read_bool();");
          else if (t2 === "Char") out.push(pad + 'scanf(" %c", ' + ref + ");");
        } else { // java
          if (pr) out.push(pad + "System.out.print(" + pr + ");");
          if (t2 === "Integer") out.push(pad + dst2 + " = _sc.nextInt();");
          else if (t2 === "Real") out.push(pad + dst2 + " = _sc.nextDouble();");
          else if (t2 === "String") out.push(pad + dst2 + " = _sc.next();");
          else if (t2 === "Boolean") out.push(pad + dst2 + " = _jb(_sc.next());");
          else if (t2 === "Char") out.push(pad + dst2 + " = _jc(_sc.next());");
        }
        break;
      }
      case "output": {
        var ex2 = parse(b.expr);
        var e2 = emit(ex2, lang, fn);
        var nl = b.nl !== false;
        if (lang === "python") out.push(pad + "print(_fmt(" + e2 + ")" + (nl ? "" : ', end=""') + ")");
        else if (lang === "js") out.push(pad + (nl ? "console.log(_fmt(" : "process.stdout.write(_fmt(") + e2 + "));");
        else if (lang === "c") {
          var t3 = inferType(ex2, fn) || "Real";
          var fmtc = { Integer: "%d\\n", Real: "%g\\n", String: "%s\\n", Boolean: "%s\\n", Char: "%c\\n", Unknown: "%g\\n" }[t3];
          if (!nl) fmtc = fmtc.replace("\\n", "");
          if (t3 === "Integer") out.push(pad + 'printf("' + fmtc + '", (int)(' + e2 + "));");
          else if (t3 === "Real" || t3 === "Unknown") out.push(pad + 'printf("' + fmtc + '", (double)(' + e2 + "));");
          else if (t3 === "Boolean") out.push(pad + 'printf("' + fmtc + '", (' + e2 + ') ? "true" : "false");');
          else out.push(pad + 'printf("' + fmtc + '", ' + e2 + ");");
        } else out.push(pad + "System.out." + (nl ? "println" : "print") + "(_fmt(" + e2 + "));");
        break;
      }
      case "if": {
        var c = emit(parse(b.cond), lang, fn);
        if (lang === "python") {
          out.push(pad + "if " + c + ":");
          out.push.apply(out, genChain(b.then, lang, fn, ind + 1));
          if (b.else.length) {
            out.push(pad + "else:");
            out.push.apply(out, genChain(b.else, lang, fn, ind + 1));
          }
        } else {
          out.push(pad + "if (" + c + ") {");
          out.push.apply(out, genChain(b.then, lang, fn, ind + 1));
          if (b.else.length) {
            out.push(pad + "} else {");
            out.push.apply(out, genChain(b.else, lang, fn, ind + 1));
          }
          out.push(pad + "}");
        }
        break;
      }
      case "while": {
        var c2 = emit(parse(b.cond), lang, fn);
        if (lang === "python") {
          out.push(pad + "while " + c2 + ":");
          out.push.apply(out, genChain(b.body, lang, fn, ind + 1));
        } else {
          out.push(pad + "while (" + c2 + ") {");
          out.push.apply(out, genChain(b.body, lang, fn, ind + 1));
          out.push(pad + "}");
        }
        break;
      }
      case "for": {
        var fE = emit(parse(b.from), lang, fn), tE = emit(parse(b.to), lang, fn);
        var sE = emit(parse(b.step || "1"), lang, fn);
        var down = b.dir === "down";
        if (lang === "python") {
          out.push(pad + "for " + b.var + " in range(" + fE + ", " + tE + (down ? " - 1" : " + 1") + ", " + (down ? "-" + sE : sE) + "):");
          out.push.apply(out, genChain(b.body, lang, fn, ind + 1));
        } else {
          out.push(pad + "for (" + b.var + " = " + fE + "; " + b.var + (down ? " >= " : " <= ") + tE + "; " + b.var + (down ? " -= " : " += ") + sE + ") {");
          out.push.apply(out, genChain(b.body, lang, fn, ind + 1));
          out.push(pad + "}");
        }
        break;
      }
      case "do": {
        if (lang === "python") {
          out.push(pad + "while True:");
          out.push.apply(out, genChain(b.body, lang, fn, ind + 1));
          var cd = emit(parse(b.cond), lang, fn);
          out.push(new Array(ind + 2).join("    ") + "if not (" + cd + "):");
          out.push(new Array(ind + 3).join("    ") + "break");
        } else {
          out.push(pad + "do {");
          out.push.apply(out, genChain(b.body, lang, fn, ind + 1));
          out.push(pad + "} while (" + emit(parse(b.cond), lang, fn) + ");");
        }
        break;
      }
      case "call": {
        var uf = findFnByName(b.fn);
        var args = (b.args || []).map(function (x) { return emit(parse(x), lang, fn); }).join(", ");
        var nm2 = b.fn;
        if (lang === "java" && uf && uf.name === "Main") nm2 = "Main_";
        if (lang === "c" && uf && uf.name === "Main") nm2 = "main";
        out.push(pad + nm2 + "(" + args + ")" + (lang === "python" ? "" : ";"));
        break;
      }
      case "return": {
        if (b.expr) {
          var rv = emit(parse(b.expr), lang, fn);
          if (lang === "python") out.push(pad + "return " + rv);
          else if (lang === "c" && opts.isMain) out.push(pad + "return 0;");
          else out.push(pad + "return " + rv + ";");
        } else {
          if (lang === "python") out.push(pad + "return");
          else if (lang === "c" && opts.isMain) out.push(pad + "return 0;");
          else out.push(pad + "return;");
        }
        break;
      }
    }
  });
  return out;
}

function declaresOf(fn) {
  var out = [];
  walkChain(fn.body, function (b) {
    if (b.type === "declare") b.vars.forEach(function (v) { out.push(v); });
  });
  return out;
}

function genFunction(lang, fn) {
  var lines = [];
  var vars = declaresOf(fn);
  var I = lang === "python" ? "    " : "  ";
  if (lang === "python") {
    lines.push("def " + (fn.name === "Main" ? "main" : fn.name) + "(" + (fn.params || []).map(function (p) { return p.name; }).join(", ") + "):");
    vars.forEach(function (v) {
      if (v.arr) lines.push(I + v.name + " = [" + PYDEF[v.type].replace(/'/g, '"') + "] * " + emit(parse(v.size), "python", fn));
      else lines.push(I + v.name + " = " + PYDEF[v.type]);
    });
    if (!vars.length) lines.push(I + "pass");
    lines.push.apply(lines, genChain(fn.body, "python", fn, 1));
  } else if (lang === "js") {
    lines.push("function " + (fn.name === "Main" ? "main" : fn.name) + "(" + (fn.params || []).map(function (p) { return p.name; }).join(", ") + ") {");
    var names = (fn.params || []).map(function (p) { return p.name; });
    vars.forEach(function (v) { if (names.indexOf(v.name) < 0) names.push(v.name); });
    vars.forEach(function (v) {
      if (v.arr) lines.push(I + "var " + v.name + " = new Array(" + emit(parse(v.size), "js", fn) + ").fill(" + JSDEF[v.type] + ");");
    });
    if (names.length) lines.push(I + "var " + names.filter(function (nm3, ix) { return vars.some(function (v) { return v.name === nm3; }); }).join(", ") + ";");
    lines.push.apply(lines, genChain(fn.body, "js", fn, 1));
    lines.push("}");
  } else if (lang === "c") {
    var rt = fn.name === "Main" ? "int" : (fn.ret ? CTYPE[fn.ret] : "void");
    var ps = (fn.params || []).map(function (p) { return CTYPE[p.type] + " " + p.name; }).join(", ");
    var nm = fn.name === "Main" ? "main" : fn.name;
    lines.push(rt + " " + nm + "(" + (ps || (fn.name === "Main" ? "void" : "void")) + ") {");
    var byType = {};
    vars.forEach(function (v) { (byType[v.type] = byType[v.type] || []).push(v); });
    Object.keys(byType).forEach(function (t) {
      var scal = byType[t].filter(function (v) { return !v.arr; });
      var arrs = byType[t].filter(function (v) { return v.arr; });
      if (scal.length) lines.push(I + CTYPE[t] + " " + scal.map(function (v) { return v.name + (t === "String" ? "[256]" : ""); }).join(", ") + ";");
      arrs.forEach(function (v) {
        var size = constEval(v.size) || 100;
        if (t === "String") lines.push(I + "char " + v.name + "[" + size + "][256];");
        else lines.push(I + CTYPE[t] + " " + v.name + "[" + size + "];");
      });
    });
    lines.push.apply(lines, genChain(fn.body, "c", fn, 1, { isMain: fn.name === "Main" }));
    if (fn.name === "Main") lines.push(I + "return 0;");
    lines.push("}");
  } else { // java
    var rt2 = fn.ret ? JTYPE[fn.ret] : "void";
    var ps2 = (fn.params || []).map(function (p) { return JTYPE[p.type] + " " + p.name; }).join(", ");
    var nm2 = fn.name === "Main" ? "main" : fn.name;
    lines.push("    static " + rt2 + " " + nm2 + "(" + (fn.name === "Main" ? "String[] args" : ps2) + ") {");
    vars.forEach(function (v) {
      if (v.arr) lines.push("        " + JTYPE[v.type] + "[] " + v.name + " = new " + JTYPE[v.type] + "[" + emit(parse(v.size), "java", fn) + "];");
      else if (v.type !== "String") lines.push("        " + JTYPE[v.type] + " " + v.name + " = " + { Integer: "0", Real: "0.0", Boolean: "false", Char: "' '" }[v.type] + ";");
      else lines.push("        String " + v.name + ' = "";');
    });
    lines.push.apply(lines, genChain(fn.body, "java", fn, 2).map(function (s) { return "    " + s; }));
    lines.push("    }");
  }
  return lines;
}

function genProgram(lang) {
  var out = [];
  var mains = fns()[0];
  var rest = fns().slice(1);
  if (lang === "python") {
    out.push("# Generato con FlowWeb (flowchart -> Python)");
    out.push("import math, random");
    out.push("");
    out.push("def _fmt(x):");
    out.push("    if isinstance(x, bool):");
    out.push('        return "true" if x else "false"');
    out.push("    return str(x)");
    out.push("");
    out.push("def _tdiv(a, b):");
    out.push("    return int(a / b)");
    out.push("");
    out.push('def _pb(s):');
    out.push('    return s.strip().lower() in ("true", "vero", "1", "si", "s\u00ec", "yes", "y")');
    out.push("");
    rest.forEach(function (f) { out.push.apply(out, genFunction("python", f)); out.push(""); });
    out.push.apply(out, genFunction("python", mains));
    out.push("");
    out.push('if __name__ == "__main__":');
    out.push("    main()");
  } else if (lang === "js") {
    out.push("// Generato con FlowWeb (flowchart -> JavaScript)");
    out.push("function _fmt(x) {");
    out.push("    if (typeof x === \"boolean\") return x ? \"true\" : \"false\";");
    out.push("    if (typeof x === \"number\" && !Number.isInteger(x)) {");
    out.push("        let s = x.toPrecision(10);");
    out.push("        if (s.indexOf(\".\") >= 0) s = s.replace(/0+$/, \"\").replace(/\\.$/, \"\");");
    out.push("        return s;");
    out.push("    }");
    out.push("    return String(x);");
    out.push("}");
    out.push('function _pb(s) { return ["true", "vero", "1", "si", "s\u00ec", "yes", "y"].includes(s.trim().toLowerCase()); }');
    out.push("");
    rest.forEach(function (f) { out.push.apply(out, genFunction("js", f)); out.push(""); });
    out.push.apply(out, genFunction("js", mains));
    out.push("");
    out.push("main();");
  } else if (lang === "c") {
    out.push("/* Generato con FlowWeb (flowchart -> C) */");
    out.push("#include <stdio.h>");
    out.push("#include <stdlib.h>");
    out.push("#include <string.h>");
    out.push("#include <math.h>");
    out.push("#include <stdbool.h>");
    out.push("#include <time.h>");
    out.push("");
    out.push("static char* concat(const char* a, const char* b) { char* r = malloc(strlen(a)+strlen(b)+1); strcpy(r, a); strcat(r, b); return r; }");
    out.push("static char* str_int(int v) { char* r = malloc(32); sprintf(r, \"%d\", v); return r; }");
    out.push("static char* str_real(double v) { char* r = malloc(32); sprintf(r, \"%g\", v); return r; }");
    out.push("static char* str_bool(bool v) { char* r = malloc(6); strcpy(r, v ? \"true\" : \"false\"); return r; }");
    out.push("static char* str_char(char v) { char* r = malloc(2); r[0] = v; r[1] = 0; return r; }");
    out.push("static char* ctos(char v) { char* r = malloc(2); r[0] = v; r[1] = 0; return r; }");
    out.push("static bool read_bool() { int t; scanf(\"%d\", &t); return t != 0; }");
    out.push("static double _min(double a, double b) { return a < b ? a : b; }");
    out.push("static double _max(double a, double b) { return a > b ? a : b; }");
    out.push("");
    rest.forEach(function (f) {
      var rt = f.ret ? CTYPE[f.ret] : "void";
      var ps = (f.params || []).map(function (p) { return CTYPE[p.type] + " " + p.name; }).join(", ");
      out.push(rt + " " + f.name + "(" + ps + ");");
    });
    out.push("");
    rest.forEach(function (f) { out.push.apply(out, genFunction("c", f)); out.push(""); });
    out.push.apply(out, genFunction("c", mains));
  } else { // java
    out.push("// Generato con FlowWeb (flowchart -> Java)");
    out.push("import java.util.Scanner;");
    out.push("");
    out.push("public class Program {");
    out.push("    static Scanner _sc = new Scanner(System.in);");
    out.push("");
    out.push("    static String _fmt(Object x) {");
    out.push("        if (x instanceof Boolean) return ((Boolean) x) ? \"true\" : \"false\";");
    out.push("        if (x instanceof Double) {");
    out.push("            double d = (Double) x;");
    out.push("            if (d == Math.floor(d) && !Double.isInfinite(d)) return String.valueOf((long) d);");
    out.push("            return String.valueOf(d);");
    out.push("        }");
    out.push("        return String.valueOf(x);");
    out.push("    }");
    out.push('    static boolean _jb(String s) { String w = s.trim().toLowerCase(); return "true".equals(w) || "vero".equals(w) || "1".equals(w) || "si".equals(w) || "s\u00ec".equals(w) || "yes".equals(w) || "y".equals(w); }');
    out.push('    static char _jc(String s) { return (s + " ").charAt(0); }');
    out.push("");
    rest.forEach(function (f) { out.push.apply(out, genFunction("java", f)); out.push(""); });
    out.push.apply(out, genFunction("java", mains));
    out.push("}");
  }
  return out.join("\n");
}

/* ---- tabs funzioni ---- */
function updateTabs() {
  var host = document.getElementById("fntabs");
  host.innerHTML = "";
  fns().forEach(function (f) {
    var t = document.createElement("div");
    t.className = "fntab" + (f.id === currentFn().id ? " active" : "");
    t.textContent = f.name;
    t.onclick = function () { if (RT.state !== "running") { curFnId = f.id; render(); } };
    t.oncontextmenu = function (e) {
      e.preventDefault();
      showCtxMenu(e.clientX, e.clientY, [
        { label: t("fn.editSignature"), action: function () { openFunctionModal(f); } },
        { label: t("fn.delete"), disabled: f.name === "Main", action: function () { deleteFunction(f); } }
      ]);
    };
    host.appendChild(t);
  });
  var add = document.createElement("div");
  add.className = "fntab add";
  add.textContent = "+";
  add.title = t("fn.addHint");
  add.onclick = function () { openFunctionModal(null); };
  host.appendChild(add);
}

function deleteFunction(f) {
  var i = fns().indexOf(f);
  if (i < 0) return;
  openConfirm("Eliminare la funzione '" + f.name + "'?", function () {
    fns().splice(i, 1);
    if (curFnId === f.id) curFnId = fns()[0].id;
    commit();
  });
}

function commit() {
  render();
  saveLocal();
}

/* ---- drag & drop ---- */
var DRAG_TYPE = null;
function setupDnD() {
  var svg = document.getElementById("svg");
  svg.addEventListener("dragover", function (e) {
    e.preventDefault();
    if (!DRAG_TYPE) return;
    svg.classList.add("dragging");
    var z = zoneAt(svgPoint(e));
    DRAW.zones.forEach(function (zz) { zz.el.classList.toggle("hot", zz === z); });
  });
  svg.addEventListener("drop", function (e) {
    e.preventDefault();
    svg.classList.remove("dragging");
    var t = DRAG_TYPE || e.dataTransfer.getData("text/blocktype");
    var z = zoneAt(svgPoint(e));
    if (t && z) {
      var b = newBlock(t);
      z.arr.splice(z.index, 0, b);
      commit();
      openBlockModal(b, true);
    }
    DRAG_TYPE = null;
  });
  svg.addEventListener("dragleave", function () { /* zone evidenziate gestite in dragover */ });

  document.addEventListener("dragend", function () {
    document.getElementById("svg").classList.remove("dragging");
    DRAG_TYPE = null;
  });
}

/* ---- context menu / click su blocchi ---- */
function showCtxMenu(x, y, items) {
  var old = document.getElementById("ctxmenu"); if (old) old.remove();
  var m = document.createElement("div");
  m.id = "ctxmenu";
  items.forEach(function (it) {
    if (it.sep) { var s = document.createElement("div"); s.className = "sep"; m.appendChild(s); return; }
    var d = document.createElement("div");
    d.className = "di" + (it.disabled ? " disabled" : "");
    d.textContent = it.label;
    if (!it.disabled) d.onclick = function () { m.remove(); it.action(); };
    m.appendChild(d);
  });
  document.body.appendChild(m);
  m.style.left = Math.min(x, window.innerWidth - 200) + "px";
  m.style.top = Math.min(y, window.innerHeight - 30 - items.length * 26) + "px";
  setTimeout(function () {
    document.addEventListener("mousedown", function h(e) {
      if (!m.contains(e.target)) { m.remove(); document.removeEventListener("mousedown", h); }
    });
  }, 0);
}

function setupSvgEvents() {
  var svg = document.getElementById("svg");
  svg.addEventListener("dblclick", function (e) {
    var g = e.target.closest(".blk");
    if (!g) return;
    if (g.dataset.id === "__fn__") { openFunctionModal(currentFn()); return; }
    var ref = findBlock(g.dataset.id);
    if (ref) openBlockModal(ref.block, false);
  });
  svg.addEventListener("contextmenu", function (e) {
    var g = e.target.closest(".blk");
    if (!g) return;
    e.preventDefault();
    if (g.dataset.id === "__fn__") return;
    var ref = findBlock(g.dataset.id);
    if (!ref) return;
    showCtxMenu(e.clientX, e.clientY, [
      { label: "Modifica", action: function () { openBlockModal(ref.block, false); } },
      { label: "Duplica", action: function () { ref.arr.splice(ref.index + 1, 0, cloneBlock(ref.block)); commit(); } },
      { sep: true },
      { label: "Elimina", action: function () { ref.arr.splice(ref.index, 1); commit(); } }
    ]);
  });
}

var THEME_PREF = "auto";
function setThemePref(pref) {
  THEME_PREF = pref;
  try { localStorage.setItem("flowweb.theme", pref); } catch (e) {}
  applyTheme();
  setStatus(t("status.theme") + ": " + t("menu.theme" + pref.charAt(0).toUpperCase() + pref.slice(1)).split(": ")[1]);
}
function applyTheme() {
  var dark = THEME_PREF === "dark" ||
    (THEME_PREF === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
function initTheme() {
  try { THEME_PREF = localStorage.getItem("flowweb.theme") || "auto"; } catch (e) {}
  applyTheme();
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function () { if (THEME_PREF === "auto") applyTheme(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
}
function loadLocal() {
  try {
    var s = localStorage.getItem("flowweb.autosave");
    if (s) {
      var p = JSON.parse(s);
      if (p && p.functions && p.functions.length) { PROGRAM = p; curFnId = PROGRAM.functions[0].id; return true; }

}

function exportPNG() {
  var svg = document.getElementById("svg");
  var clone = svg.cloneNode(true);
  clone.querySelectorAll(".dz").forEach(function (x) { x.remove(); });
  clone.querySelectorAll(".blk.current, .blk.err").forEach(function (x) { x.classList.remove("current"); x.classList.remove("err"); });
  clone.setAttribute("xmlns", NS);
  /* embed the stylesheet so exported blocks keep colors, strokes and fonts */
  var style = document.createElementNS(NS, "style");
  style.textContent = Array.prototype.slice.call(document.styleSheets[0].cssRules).map(function (r) { return r.cssText; }).join("\n");
  clone.insertBefore(style, clone.firstChild);
  var w = DRAW.maxX - DRAW.minX, h = DRAW.maxY - DRAW.minY;
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  var data = new XMLSerializer().serializeToString(clone);
  var img = new Image();
  img.onload = function () {
    var c = document.createElement("canvas");
    c.width = w * 2; c.height = h * 2;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    var a = document.createElement("a");
    a.href = c.toDataURL("image/png");
    a.download = (fns()[0].name || "diagramma") + ".png";
    a.click();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data);
}

      { label: t("dlg.ok"), primary: true, action: function (body) {

        add.onclick = function () { el.addRow({ name: "", type: "Integer", arr: false, size: "10" }); };
        body.appendChild(add);

      }
      case "assign": {
        var vs = varSelect(fn);
        vs.value = b.var || "";

        body.appendChild(row1);

        var idxRow = frow(t("dlg.idx"), idxWrap);

        body.appendChild(idxRow);

          var v = collectVars(fn).filter(function (x) { return x.name === vs.value; })[0];
          idxRow.style.display = v && v.arr ? "" : "none";
        }
        vs.onchange = syncIdx; syncIdx();
        var ex = ftext(b.expr || "", t("dlg.exprHint"), true);

      case "input": {

        var idxWrap2 = document.createElement("div");
        var idxInp2 = ftext(b.index || "", t("dlg.varHint"));
        idxWrap2.appendChild(idxInp2);
        var idxRow2 = frow(t("dlg.idx"), idxWrap2);
        idxRow2.style.display = "none";
        body.appendChild(idxRow2);
        function syncIdx2() {
          var v = collectVars(fn).filter(function (x) { return x.name === vs2.value; })[0];
          idxRow2.style.display = v && v.arr ? "" : "none";
        }
        vs2.onchange = syncIdx2; syncIdx2();

        body.appendChild(frow(t("dlg.prompt"), pr));
        el = { get: function () { return { var: vs2.value, index: idxRow2.style.display === "none" ? null : idxInp2.value, prompt: pr.value }; } };
        break;
      }
      case "output": {

        body.appendChild(frow("", fcheck(b.nl !== false, t("dlg.nl"))));
        el = { get: function () {

      }
      case "if": case "while": case "do": {

        body.appendChild(frow(t("dlg.cond"), c));
        el = { get: function () { return { cond: c.value }; } };

      case "for": {
        var vs3 = varSelect(fn, function (v) { return v.type === "Integer" && !v.arr; });

        body.appendChild(frow(t("dlg.var"), vs3));
        var fr = ftext(b.from || "1", "es. 1");
        body.appendChild(frow("Da", fr));

        body.appendChild(frow("A", to));
        var st = ftext(b.step || "1", "es. 2");
        body.appendChild(frow(t("dlg.step"), st));
        var dir = fsel([{ v: "up", t: t("dlg.dirup") }, { v: "down", t: t("dlg.dirdown") }], b.dir || "up");

        el = { get: function () { return { var: vs3.value, from: fr.value, to: to.value, step: st.value, dir: dir.value }; } };

      }
      case "call": {
        var fopts = [{ v: "", t: t("dlg.chooseFn") }].concat(fns().map(function (f) {
          return { v: f.name, t: f.name + "(" + (f.params || []).map(function (p) { return p.name; }).join(", ") + ")" + (f.ret ? " : " + f.ret : "") };

        var fs = fsel(fopts, b.fn || "");
        body.appendChild(frow(t("dlg.fn"), fs));
        var argsHost = document.createElement("div");
        body.appendChild(frow(t("dlg.args"), argsHost));
        function rebuildArgs(sel) {
          argsHost.innerHTML = "";
          var f = findFnByName(sel);
          if (!f) return;
          (f.params || []).forEach(function (p, i) {
            var a = ftext((b.args && b.args[i]) || "", p.name + " (" + p.type + ")", true);
            argsHost.appendChild(a);
          });
        }
        fs.onchange = function () { rebuildArgs(fs.value); };
        rebuildArgs(b.fn);
        el = { get: function () {
          return { fn: fs.value, args: Array.prototype.slice.call(argsHost.querySelectorAll("input")).map(function (i) { return i.value; }) };
        } };

      case "return": {

        var data = el.get();

}

function validateBlock(b, d) {
  function tryParse(s, what) {
    try { parse(s); return null; } catch (e) { return what + ": " + e.message; }
  }
  var fn = currentFn();
  switch (b.type) {
    case "declare":
      if (!d.vars.length) return I18N_CUR==="it"?"Serve almeno una variabile":"At least one variable is required";
      for (var i = 0; i < d.vars.length; i++) {
        var v = d.vars[i];
        if (!/^[A-Za-z_]\w*$/.test(v.name)) return I18N_CUR==="it"?"Nome variabile non valido: '":"Invalid variable name: '" + v.name + "'";
        if (v.arr && (constEval(v.size) === null || constEval(v.size) < 1)) return "Dimensione array non valida per " + v.name;
      }
      return null;
    case "assign": case "input":
      if (!d.var) return I18N_CUR==="it"?"Scegli una variabile":"Choose a variable";
      if (d.index) { var e1 = tryParse(d.index, "Indice"); if (e1) return e1; }
      if (b.type === "assign") { if (!d.expr) return I18N_CUR==="it"?"Manca l'espressione":"Missing expression"; var e2 = tryParse(d.expr, "Espressione"); if (e2) return e2; }
      return null;
    case "output":
      if (!d.expr) return "Manca l'espressione";
      return tryParse(d.expr, "Espressione");
    case "if": case "while": case "do":
      if (!d.cond) return I18N_CUR==="it"?"Manca la condizione":"Missing condition";
      return tryParse(d.cond, "Condizione");
    case "for":
      if (!d.var) return I18N_CUR==="it"?"Scegli la variabile contatore":"Choose the counter variable";
      if (constEval(d.step) === 0) return I18N_CUR==="it"?"Il passo non pu\u00f2 essere 0":"The step cannot be 0";
      var eF = tryParse(d.from, "Da"); if (eF) return eF;
      var eT = tryParse(d.to, "A"); if (eT) return eT;
      var eS = tryParse(d.step, "Passo"); if (eS) return eS;
      return null;
    case "call":
      if (!d.fn) return I18N_CUR==="it"?"Scegli una funzione":"Choose a function";
      var f = findFnByName(d.fn);
      if (!f) return I18N_CUR==="it"?"Funzione inesistente":"Unknown function";
      if (d.args.length !== (f.params || []).length) return (I18N_CUR==="it"?"Attesi ":"Expected ") + (f.params || []).length + (I18N_CUR==="it"?" argomenti":" arguments");
      for (var j = 0; j < d.args.length; j++) {
        if (!d.args[j]) return (I18N_CUR==="it"?"Manca l'argomento ":"Missing argument ") + (j + 1);
        var eA = tryParse(d.args[j], "Argomento " + (j + 1)); if (eA) return eA;
      }
      return null;
    case "return":
      if (fn.ret && d.expr) return tryParse(d.expr, "Espressione");
      return null;
  }
  return null;
}

function buildDeclareRows(vars) {
  var table = document.createElement("table");
  table.className = "rows-table";
  var rows = deepCopy(vars);
  function render() {
    table.innerHTML = "<tr><td></td><td>Nome</td><td>Tipo</td><td>Array</td><td>Dim.</td><td></td></tr>";
    rows.forEach(function (r, i) {
      var tr = document.createElement("tr");
      var td0 = document.createElement("td"); td0.textContent = "var";
      var name = document.createElement("input"); name.value = r.name;
      name.oninput = function () { r.name = name.value; };
      var type = fsel(TYPES.map(function (t) { return { v: t, t: t }; }), r.type);
      type.onchange = function () { r.type = type.value; };
      var arr = document.createElement("input"); arr.type = "checkbox"; arr.checked = r.arr;
      arr.onchange = function () { r.arr = arr.checked; render(); };
      var size = document.createElement("input"); size.value = r.size || "10";
      size.oninput = function () { r.size = size.value; };
      var del = document.createElement("button");
      del.className = "btn small";
      del.textContent = "\u2715";
      del.onclick = function () { rows.splice(i, 1); render(); };
      [name, type, arr, size].forEach(function (c) { var td = document.createElement("td"); td.appendChild(c); tr.appendChild(td); });
      var tdd = document.createElement("td"); tdd.className = "delrow"; tdd.appendChild(del); tr.appendChild(tdd);
      table.appendChild(tr);
    });
  }
  render();
  return {
    table: table,
    addRow: function (r) { rows.push(r); render(); },
    get: function () { return { vars: rows }; }
  };
}

function openFunctionModal(fn) {
  var isNew = !fn;
  var data = fn ? { name: fn.name, params: deepCopy(fn.params || []), ret: fn.ret } : { name: "Funzione" + (fns().length + 1), params: [], ret: null };
  var el;
  modalOpen(isNew ? t("dlg.title.newFn") : t("dlg.title.editFn"), function (body) {
    var name = ftext(data.name);
    body.appendChild(frow(t("dlg.fnName"), name));
    var table = document.createElement("table");
    table.className = "rows-table";
    function renderP() {
      table.innerHTML = "<tr><td>Parametro</td><td>Tipo</td><td></td></tr>";
      data.params.forEach(function (p, i) {
        var tr = document.createElement("tr");
        var pn = document.createElement("input"); pn.value = p.name;
        pn.oninput = function () { p.name = pn.value; };
        var pt = fsel(TYPES.map(function (t) { return { v: t, t: t }; }), p.type);
        pt.onchange = function () { p.type = pt.value; };
        var del = document.createElement("button"); del.className = "btn small"; del.textContent = "\u2715";
        del.onclick = function () { data.params.splice(i, 1); renderP(); };
        [pn, pt].forEach(function (c) { var td = document.createElement("td"); td.appendChild(c); tr.appendChild(td); });
        var tdd = document.createElement("td"); tdd.className = "delrow"; tdd.appendChild(del); tr.appendChild(tdd);
        table.appendChild(tr);
      });
    }
    renderP();
    body.appendChild(frow(t("dlg.params"), table));
    var addP = document.createElement("button");
    addP.className = "btn small";
    addP.textContent = t("dlg.addparam");
    addP.onclick = function () { data.params.push({ name: "p" + (data.params.length + 1), type: "Integer" }); renderP(); };
    body.appendChild(frow("", addP));
    var ret = fsel([{ v: "", t: t("dlg.returns.none") }].concat(TYPES.map(function (t) { return { v: t, t: t }; })), data.ret || "");
    body.appendChild(frow(t("dlg.returns"), ret));
    el = { get: function () { return { name: name.value.trim(), params: data.params, ret: ret.value || null }; } };
  }, [
    { label: "Annulla", action: function (b, e, close) { close(); } },
    { label: "OK", primary: true, action: function (b, e, close) {
        var d = el.get();
        if (!/^[A-Za-z_]\w*$/.test(d.name)) { e.textContent = t("err.badName"); return; }
        var clash = fns().some(function (f) { return f !== fn && f.name.toLowerCase() === d.name.toLowerCase(); });
        if (clash) { e.textContent = t("err.dupFn"); return; }
        for (var i = 0; i < d.params.length; i++) {
          if (!/^[A-Za-z_]\w*$/.test(d.params[i].name)) { e.textContent = t("err.badParamName"); return; }
        }
        if (d.name.toLowerCase() === "main" && !isNew && fn && fn.name !== "Main" && fns()[0] !== fn) { /* ok */ }
        if (isNew) {
          var f2 = newFn(d.name);
          f2.params = d.params; f2.ret = d.ret;
          fns().push(f2);
          curFnId = f2.id;
        } else {
          fn.name = d.name; fn.params = d.params; fn.ret = d.ret;
        }
        close();
        commit();
      } }
  ]);
}

function boot() {
  initTheme();
  initI18n();
  applyI18n();
  setupDnD();
  setupSvgEvents();
  document.querySelectorAll(".btab").forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll(".btab").forEach(function (x) { x.classList.remove("active"); });
      document.querySelectorAll(".bpanel").forEach(function (p) { p.classList.remove("active"); });
      t.classList.add("active");
      document.getElementById("panel-" + t.dataset.p).classList.add("active");
      if (t.dataset.p === "turtle") turtleDrawMark();
    };
  });
  document.getElementById("console-clear").onclick = consoleClear;
  document.addEventListener("keydown", function (e) {
    if (e.key === "F5") { e.preventDefault(); doRunBtn(); }
    if (e.key === "F10") { e.preventDefault(); doStepBtn(); }
  });
  if (!loadLocal()) {
    PROGRAM = EXAMPLES[1].make(); // Indovina il numero
    curFnId = PROGRAM.functions[0].id;
  }
  render();
  turtleReset();
  consoleAppend(t("run.welcome") + "\n", "sys");
  setStatus("Pronto.");
}

if (typeof document !== "undefined" && document.getElementById("svg")) {
  boot();
