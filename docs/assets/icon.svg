<?xml version="1.0" encoding="UTF-8"?>
<!-- FlowWeb app icon: three flowchart nodes linked by arrows,
     rounded-square container with a blue-to-purple gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <!-- start pill -->
  <rect x="88" y="24" width="80" height="44" rx="22" fill="#1a1c1e"/>
  <!-- middle block (assign) with two code lines -->
  <rect x="76" y="100" width="104" height="54" rx="12" fill="#ffffff" fill-opacity=".95"/>
  <path d="M96 118h48M96 134h32" stroke="#0d248a" stroke-width="8" stroke-linecap="round"/>
  <!-- end diamond -->
  <path d="M128 188 L168 212 L128 236 L88 212 Z" fill="#ffffff" fill-opacity=".95"/>
  <!-- connectors -->
  <path d="M128 68 V92 M128 154 V184" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <polygon points="116,88 140,88 128,96" fill="#ffffff"/>
  <polygon points="116,180 140,180 128,188" fill="#ffffff"/>
</svg>
